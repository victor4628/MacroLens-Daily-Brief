name: MacroLens Daily Brief

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 17:00 EST (UTC-5) / 18:00 EDT (UTC-4) on weekdays
  workflow_dispatch:           # allow manual runs from GitHub UI

permissions:
  contents: write              # needed to commit the report back

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install WeasyPrint system dependencies
        run: sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MacroLens Daily Brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:   ${{ secrets.ANTHROPIC_MODEL }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL:    ${{ secrets.DEEPSEEK_MODEL }}
          FINNHUB_API_KEY:   ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          LANGSMITH_API_KEY:  ${{ secrets.LANGSMITH_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Remove PDFs older than 60 days
        run: |
          python - <<'EOF'
          from datetime import datetime, timedelta
          from pathlib import Path
          cutoff = datetime.now() - timedelta(days=60)
          for f in Path("outputs").glob("brief_*.pdf"):
              try:
                  file_date = datetime.strptime(f.stem.replace("brief_", ""), "%Y%m%d")
                  if file_date < cutoff:
                      f.unlink()
                      print(f"Deleted {f.name}")
              except ValueError:
                  pass
          EOF

      - name: Commit generated report
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add outputs/
          git diff --staged --quiet \
            || git commit -m "chore: daily brief $(date -u +'%Y-%m-%d')"
          git push
